<!DOCTYPE html>
<html>
<head>
    <title>Explore India</title>
    <link rel="stylesheet" href="./css/style.css">
</head>
<body>

<header>
    <h1>Explore India!!</h1>

    <nav>
        <a href="#">Home</a>
        <a href="#">Places</a>
        <a href="gallery.html">Gallery</a>
        <a href="#contact">Contact</a>
    </nav>
</header>

<section class="hero">
    <h2>Discover Incredible India</h2>
    <p>Experience culture, heritage and nature.</p>

    <button onclick="showMessage()">
        Explore More
    </button>
</section>

<section class="places">

    <div class="card">
        <img src="./images/tajmahal.jpg" alt="Taj Mahal in Agra, Uttar Pradesh">
        <h3>Taj Mahal</h3>
        <p>Agra, Uttar Pradesh</p>
    </div>

    <div class="card">
        <img src="./images/kerala.jpg" alt="Houseboat in Kerala Backwaters">
        <h3>Kerala Backwaters</h3>
        <p>God's Own Country</p>
    </div>

    <div class="card">
        <img src="./images/goa.jpeg" alt="Scenic tropical beach in Goa">
        <h3>Goa Beaches</h3>
        <p>Sun, Sand and Sea</p>
    </div>

</section>

<section id="contact" class="contact-section">
    <h2>Contact Us</h2>
    <form class="contact-form" onsubmit="submitForm(event)">
        <input type="text" placeholder="Your Name" required>
        <input type="email" placeholder="Your Email" required>
        <textarea placeholder="Your Message" required></textarea>
        <button type="submit">Send Message</button>
    </form>
    <p id="contact-response"></p>
</section>

<footer>
    <p>© 2026 Explore India</p>
</footer>

<script src="./scripts/script.js"></script>

</body>
</html>
